  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <script>
    (function() {
      var hostname = window.location.hostname.toLowerCase();
      var pathname = window.location.pathname.toLowerCase();
      var search = window.location.search.toLowerCase();
      var hash = window.location.hash.toLowerCase();
      var params = new URLSearchParams(window.location.search);
      var view = (params.get('view') || '').toLowerCase();
      
      // Check stored session info if available
      var isDSSession = false;
      var isSpeechSession = false;
      try {
        var instType = (localStorage.getItem('eduai_last_institution_type') || '').toLowerCase();
        var activeRole = (localStorage.getItem('eduai_active_role') || '').toLowerCase();
        var cachedUser = localStorage.getItem('currentUser') || localStorage.getItem('eduai_user') || '';
        if (
          instType === 'driving_school' || 
          cachedUser.includes('"isdsstudent":true') || 
          cachedUser.includes('"isdsstudent": true') ||
          cachedUser.includes('driving_school') || 
          localStorage.getItem('ds_nav_layout') || 
          localStorage.getItem('ds_student_session') ||
          sessionStorage.getItem('ds_student_session')
        ) {
          isDSSession = true;
        }
        if (localStorage.getItem('speechbuddy_registered_user') && (view === 'speechbuddy' || hash.includes('speechbuddy'))) {
          isSpeechSession = true;
        }
      } catch (e) {}

      var isPortalHost = hostname === 'portal.eduai.co.ke' || hostname === 'erp.eduai.co.ke' || hostname === 'app.eduai.co.ke' || hostname === 'eduai.co.ke' || hostname === 'www.eduai.co.ke';
      var isSpeechBuddy = !isPortalHost && (view === 'speechbuddy' || view.includes('speech') || pathname.includes('speechbuddy') || hash.includes('speechbuddy') || isSpeechSession);
      var isAlumnae = !isPortalHost && (hostname.startsWith('alumnae.') || hostname.startsWith('alumni.') || hostname.startsWith('network.') || hostname.startsWith('circle.') || hostname.includes('almamater') || hostname.includes('alma_mater') || view.startsWith('alumnae_'));
      var isDriving = !isPortalHost && !isSpeechBuddy && !isAlumnae && (
        hostname.includes('drivingschool') || 
        hostname.includes('urbands') || 
        view === 'ds' || 
        view === 'driving' || 
        view === 'ds-student' || 
        view === 'ds-portal' || 
        pathname.startsWith('/ds') || 
        search.includes('view=ds') ||
        hash.includes('/ds') || 
        isDSSession
      );

      var isMarketplace = (
        view === 'marketplace' || 
        view === 'auto_market' || 
        pathname.includes('marketplace') || 
        search.includes('marketplace') || 
        hash.includes('marketplace') || 
        hostname.startsWith('market.') || 
        hostname.startsWith('marketplace.')
      );

      var title = "EduAI OS | Enterprise Automation Ecosystem";
      var desc = "Comprehensive automation ecosystem for education, hospitality, healthcare, agriculture, and business operations.";
      var manifest = "/manifest.json";
      var icon = "/eduai_logo_3d.png";
      var appleTitle = "EduAI OS";
      var themeColor = "#0F172A";

      if (isMarketplace) {
        title = "EduAI Global Marketplace | B2B Wholesale & Sourcing";
        desc = "Leading B2B wholesale marketplace for institutions, schools, enterprise equipment, vehicles, and bulk supplies with Trade Assurance.";
        manifest = "/manifest_marketplace.json";
        icon = "/marketplace_logo_3d.png";
        appleTitle = "Marketplace";
        themeColor = "#FF6000";
      } else if (isPortalHost) {
        title = "EduAI OS | Enterprise Automation Ecosystem";
        desc = "Comprehensive automation ecosystem for education, hospitality, healthcare, agriculture, and business operations.";
        manifest = "/manifest.json";
        icon = "/eduai_logo_3d.png";
        appleTitle = "EduAI OS";
        themeColor = "#0F172A";
      } else if (isSpeechBuddy) {
        title = "SpeechBuddy AI — Speech Therapy & Early Learning";
        desc = "Interactive AI speech therapy, phoneme trainer, voice games, and AAC storybook for children with speech delay.";
        manifest = "/manifest_speechbuddy.json";
        icon = "/eduai_logo_3d.png";
        appleTitle = "SpeechBuddy";
        themeColor = "#0F172A";
      } else if (isAlumnae) {
        title = "Alumnae Network | Alma Mater Digital Ecosystem & Community";
        desc = "Official Alumnae Network and Alma Mater community portal. Connect with classmates, find mentorship, and support your legacy.";
        manifest = "/manifest_alumnae.json";
        icon = "/alumnae_logo_3d.png";
        appleTitle = "Alumnae";
        themeColor = "#4f46e5";
      } else if (isDriving) {
        title = "DS Pro Master | Driving School";
        desc = "Advanced driving school portal for scheduling lessons, tracking skills, and managing instructor logs.";
        manifest = "/manifest_driving.json";
        icon = "/driving_school_logo_3d.png";
        appleTitle = "DS Pro";
        themeColor = "#0ea5e9";
      }

      document.title = title;
      
      // Update meta description
      var descMeta = document.querySelector('meta[name="description"]');
      if (descMeta) descMeta.setAttribute('content', desc);

      // Update apple-touch-icon
      var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
      if (appleIcon) appleIcon.setAttribute('href', icon);

      // Update all manifest links
      var manifestLinks = document.querySelectorAll('link[rel="manifest"]');
      if (manifestLinks.length > 0) {
        manifestLinks.forEach(function(l) { l.setAttribute('href', manifest); });
      } else {
        var newLink = document.createElement('link');
        newLink.rel = 'manifest';
        newLink.href = manifest;
        document.head.appendChild(newLink);
      }

      // Update favicon
      var faviconLinks = document.querySelectorAll('link[rel="icon"]');
      if (faviconLinks.length > 0) {
        faviconLinks.forEach(function(l) { l.setAttribute('href', icon); });
      }

      // Update theme-color
      var themeMetas = document.querySelectorAll('meta[name="theme-color"]');
      themeMetas.forEach(function(tm) { tm.setAttribute('content', themeColor); });

      // Update Apple App Title
      var appleTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (appleTitleMeta) appleTitleMeta.setAttribute('content', appleTitle);

      // Update Canonical Link
      var canonicalLink = document.querySelector('link[rel="canonical"]');
      if (canonicalLink) canonicalLink.setAttribute('href', window.location.origin + '/');

      // Update OG / Twitter meta tags
      var updateMeta = function(propertyOrName, value) {
        var el = document.querySelector('meta[property="' + propertyOrName + '"], meta[name="' + propertyOrName + '"]');
        if (el) el.setAttribute('content', value);
      };

      updateMeta('og:url', window.location.href);
      updateMeta('og:title', title);
      updateMeta('og:description', desc);
      updateMeta('og:image', window.location.origin + icon);

      updateMeta('twitter:url', window.location.href);
      updateMeta('twitter:title', title);
      updateMeta('twitter:description', desc);
      updateMeta('twitter:image', window.location.origin + icon);
    })();
  </script>

  <script>
    // Automatic deployment sync recovery for stale JS bundle hashes / MIME / initialization errors
    function triggerDeploymentSync(reason) {
      console.warn('[Deployment Sync] ' + reason + '. Purging caches & syncing assets...');
      if ('caches' in window) {
        caches.keys().then(function(keys) { keys.forEach(function(k) { caches.delete(k); }); }).catch(function(){});
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) { regs.forEach(function(r) { r.unregister(); }); }).catch(function(){});
      }
      try {
        var key = 'eduai_last_chunk_reload';
        var lastReload = window.sessionStorage ? sessionStorage.getItem(key) : null;
        var now = Date.now();
        if (!lastReload || (now - parseInt(lastReload, 10)) > 6000) {
          if (window.sessionStorage) sessionStorage.setItem(key, String(now));
          window.location.href = window.location.origin + window.location.pathname + '?sync=' + now;
        }
      } catch (storageErr) {
        window.location.reload();
      }
    }

    window.addEventListener('vite:preloadError', function (event) {
      if (event && event.preventDefault) event.preventDefault();
      triggerDeploymentSync('Vite preload error');
    });

    window.addEventListener('unhandledrejection', function (event) {
      var reason = event && event.reason;
      var msg = reason ? (reason.message || String(reason)) : '';
      if (msg && (
        msg.includes('Failed to load module script') ||
        msg.includes('MIME type') ||
        msg.includes('Loading chunk') ||
        msg.includes('dynamically imported module') ||
        msg.includes('before initialization')
      )) {
        if (event.preventDefault) event.preventDefault();
        triggerDeploymentSync('Dynamic module import rejected: ' + msg);
      }
    });

    window.addEventListener('error', function (event) {
      var msg = (event && event.message) ? event.message : '';
      var target = event && event.target;
      var isScriptTarget = target && target.tagName === 'SCRIPT';
      var isChunkError = (
        msg.includes('Failed to load module script') || 
        msg.includes('Loading chunk') || 
        msg.includes('MIME type') || 
        msg.includes('before initialization') || 
        msg.includes('ReferenceError') ||
        msg.includes('dynamically imported module') ||
        isScriptTarget
      );
      if (isChunkError) {
        triggerDeploymentSync('Stale script error: ' + (msg || (target && target.src) || 'script error'));
      }
    }, true);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          reg.onupdatefound = function () {
            var installing = reg.installing;
            if (installing) {
              installing.onstatechange = function () {
                if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[SW] New version ready. Updating service worker...');
                  if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
              };
            }
          };
        }).catch(function (err) { console.log('SW registration failed:', err); });
      });
    }
  </script>
