version: "3.8"

services:
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: eduai_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      # Public URL where this Evolution server is reachable (e.g. https://wa.eduai.co.ke or http://YOUR_VPS_IP:8080)
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      # Master API key — paste the exact same value into EduAI Super Admin -> WhatsApp Gateway -> API KEY
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-change-me-to-a-64-char-secure-token}
      # Automatically forward inbound WhatsApp messages to EduAI's Autonomous WhatsApp Agent webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${EDUAI_WEBHOOK_URL:-https://portal.eduai.co.ke/api/whatsapp-webhook}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      # Session persistence (keeps QR pairing alive across container restarts)
      - DATABASE_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
